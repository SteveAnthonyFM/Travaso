name: Release

# Builds Travaso.dmg when a version tag such as v1.0.0 is pushed and attaches it to a
# DRAFT GitHub release for review before publishing. The app is ad-hoc signed only
# (not notarized); see the README for the first-launch steps.
#
# The build job can only read the repository; only the small release job holds a write
# token. Actions are pinned to commit SHAs (the comment shows the tag each one was taken
# from); update them deliberately, not automatically.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  dmg:
    runs-on: macos-26   # Travaso targets macOS 26; needs a runner with the macOS 26 SDK
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4

      - name: Cache FFmpeg build
        id: ffmpeg-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830   # v4
        with:
          path: Vendor/ffmpeg
          key: ffmpeg-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Scripts/build-ffmpeg.sh') }}

      - name: Build FFmpeg (LGPL, from official sources)
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: |
          brew install pkgconf
          ./Scripts/build-ffmpeg.sh

      # Runs on a cache hit too, so restored binaries are never shipped unchecked.
      - name: Verify FFmpeg binaries
        run: |
          FF=Vendor/ffmpeg/bin/ffmpeg
          "$FF" -hide_banner -L 2>&1 | grep -qi "Lesser General Public License"
          ! "$FF" -hide_banner -buildconf 2>&1 | grep -q -- "--enable-gpl"
          "$FF" -hide_banner -buildconf 2>&1 | grep -q -- "--disable-network"
          "$FF" -hide_banner -buildconf 2>&1 | grep -q -- "--disable-autodetect"
          ! otool -L "$FF" Vendor/ffmpeg/bin/ffprobe | tail -n +2 | grep -v ':$' | grep -vE '/usr/lib/|/System/Library/'

      - name: Build Travaso
        run: |
          xcodebuild -project Travaso.xcodeproj -scheme Travaso -configuration Release \
            -derivedDataPath build/DerivedData clean build -quiet

      - name: Package DMG
        run: ./Scripts/make-dmg.sh "${GITHUB_REF_NAME#v}"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02   # v4
        with:
          name: dmg
          path: build/Travaso-*.dmg
          if-no-files-found: error

  release:
    needs: dmg
    runs-on: ubuntu-latest
    permissions:
      contents: write   # the only job that can create the release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
        with:
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093   # v4
        with:
          name: dmg
          path: build

      - name: Create draft release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65   # v2
        with:
          draft: true
          name: Travaso ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: build/Travaso-*.dmg
